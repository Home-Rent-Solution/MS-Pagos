server:
  port: 8085

spring:
  application:
    name: ms-pagos
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            readTimeout: ${FEIGN_READ_TIMEOUT:5000}
            loggerLevel: basic
  datasource:
    url: jdbc:postgresql://${DB_HOST:dpg-d96og0l8nd3s73bb2j80-a.oregon-postgres.render.com}:5432/homerentsolution_postgresql_ms_pagos
    username: ${DB_USER:nao}
    password: ${DB_PASSWORD:if4G3k0gBZmQfRwcGByKk6FzLXDhqic3}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

ms:
  reservas:
    url: ${MS_RESERVAS_URL:http://localhost:8084}
    validacion-habilitada: ${MS_RESERVAS_VALIDACION_HABILITADA:true}
  inquilinos:
    url: ${MS_INQUILINOS_URL:http://localhost:8083}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


